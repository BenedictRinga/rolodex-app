<ion-content>
  <!-- 2026-08-16: flex column so the rolodex list fills the remaining height and
       scrolls inside itself — the nested ion-content previously cut the bottom
       15-35% of the view. -->
  <div class="home-flex">
  <!-- 2026-08-16 THE DEMO: a help button that opens the features tour — every
       feature, a guide, one tap transports the user to that section. -->
  <div style="padding: 8px 12px 4px; border-bottom: 1px solid #333; display:flex; align-items:center; justify-content:space-between;">
    <div style="flex:1;">
      <div style="display:flex; align-items:center; gap:6px;">
        <ion-label style="font-size: 12px; color: #8b93b0;">{{ headerLine }}</ion-label>
        <span class="ai-live-dot" [class.live]="aiLive" title="AI status"></span>
        <span style="font-size: 10px; color: #3fb950; white-space: nowrap;">AI Assistant</span>
      </div>
      <ion-segment class="storage-segment" [(ngModel)]="storageLocation" (ionChange)="onStorageChange($event)" style="margin-top: 6px; max-width: 340px;">
        <ion-segment-button value="device">Device</ion-segment-button>
        <ion-segment-button value="cloud">Cloud</ion-segment-button>
        <ion-segment-button value="rolodex-server">LoopKeeper Server</ion-segment-button>
      </ion-segment>
      <!-- <ion-item lines="none" *ngIf="storageLocation === 'rolodex-server'" style="--padding-start:0;">
        <ion-input placeholder="Demo room code — link devices live" [ngModel]="demoRoom" style="font-size: 11px;" (ionChange)="onRoomInput($event)"></ion-input>
      </ion-item> -->
    </div>
    <!-- <ion-button fill="clear" (click)="openHelp()" style="font-size: 11px; --padding-start: 6px; --padding-end: 6px; min-height: 30px; margin-left: 6px; flex-shrink: 0;">
      <ion-icon name="help-circle-outline" slot="start"></ion-icon>
      Features
    </ion-button> -->
  </div>

  <!-- 2026-08-21 OPENLOOP CHAT: RolodexAI lives above the deck so the user
       always knows what/how to engage. Every assistant reply carries a copy
       button as the counterweight to the send button. -->
  <div class="openloop-chat" *ngIf="rolodexAiChatOpen">
    <div class="openloop-chat-head">
      <strong>AI Assistant</strong>
      <ion-button fill="clear" size="small" (click)="rolodexAiChatOpen = false" appTooltip="Hide chat">
        <ion-icon name="chevron-up-outline"></ion-icon>
      </ion-button>
    </div>
    <div class="openloop-chat-thread" #chatThread>
      <div *ngFor="let m of rolodexAiMessages" class="openloop-msg" [class.user]="m.from === 'user'">
        <div class="openloop-bubble">{{ m.text }}</div>
        <div *ngIf="m.from === 'assistant' && m.text" class="openloop-actions">
          <ion-button fill="clear" size="small" class="openloop-action" (click)="copyRolodexAi(m.text)" appTooltip="Copy whole reply">
            <ion-icon name="copy-outline" slot="start"></ion-icon>
            Copy
          </ion-button>
          <ion-button fill="clear" size="small" class="openloop-action" (click)="sendRolodexAiToCard(m.text)" appTooltip="Attach this reply to a card">
            <ion-icon name="paper-plane-outline" slot="start"></ion-icon>
            Card
          </ion-button>
        </div>
      </div>
      <div *ngIf="rolodexAiTyping" class="openloop-typing">
        <span class="openloop-typing-dot"></span>
        AI Assistant is writing…
      </div>
    </div>
    <div class="openloop-chat-input">
      <ion-textarea
        [(ngModel)]="rolodexAiInput"
        placeholder="Where is that open loop?"
        auto-grow
        rows="1"
        maxlength="500"
        (keydown.enter)="onChatEnter($event)"
        fill="outline"
        class="openloop-input"
      ></ion-textarea>
      <ion-button (click)="sendRolodexAi()" [disabled]="!rolodexAiInput.trim() || rolodexAiBusy">
        <ion-icon name="send-outline"></ion-icon>
      </ion-button>
    </div>
  </div>

  <app-rolodex
    #rolodex
    [contacts]="contacts"
    [displayedContacts]="displayedContacts"
    [sortedcontacts]="sortedContacts"
    [searchQuery]="searchQuery"
    [autoSortStarted]="autoSortStarted"
    [selectedFilter]="selectedFilter"
    [selectedGroup]="selectedGroup"
    [mockEnabled]="mockEnabled"
    [loading]="loading"
    [groups]="groups"
    [selectedLanguage]="selectedLanguage"
    [selectedFontSize]="selectedFontSize"
    [dormantCount]="getDormantCount()"
    [overdueCount]="followUpOverdue.length"
    [upcomingBirthdayCount]="upcomingBirthdays.length"
    [syncProviderName]="syncProviderName"
    [syncConnected]="syncConnected"
    [syncHasPassphrase]="syncHasPassphrase"
    [syncLastPushed]="syncLastPushed"
    [syncLastPulled]="syncLastPulled"
    [syncBusy]="syncBusy"
    [syncProviders]="syncProviders"
    (chatContact)="onChatContact($event)"
    (audioCallContact)="onAudioCallContact($event)"
    (videoCallContact)="onVideoCallContact($event)"
    (scheduleEvent)="onScheduleEvent($event)"
    (toggleDetails)="onToggleDetails($event)"
    (editContact)="onEditContact($event)"
    (removeContact)="onRemoveContact($event)"
    (contactTap)="onContactTap($event)"
    (contactsChange)="onContactsChange($event)"
    (autoSort)="onAutoSort()"
    (loadMoreAutoSort)="onLoadMoreAutoSort()"
    (applyFilter)="onApplyFilter()"
    (applyGroupFilter)="onApplyGroupFilter($event)"
    (toggleWelcome)="onToggleWelcome()"
    (showWelcome)="showWelcomeAgain()"
    (mockDataRepeat)="onMockDataRepeat()"
    (initMap)="onInitMap($event)"
    (createContact)="onCreateContact()"
    (acceptAutoSort)="onAcceptAutoSort()"
    (restartAutoSort)="onRestartAutoSort()"
    (cancelAutoSort)="onCancelAutoSort()"
    (resetFilters)="onResetFilters()"
    (toggleTheme)="onToggleTheme($event)"
    (toggleNotifications)="onToggleNotifications($event)"
    (changeLanguage)="onChangeLanguage($event)"
    (changeFontSize)="onChangeFontSize($event)"
    (goToPrivacySettings)="onGoToPrivacySettings()"
    (openFaq)="openHelp()"
    (helpNavigate)="onHelpNavigate($event)"
    (showAbout)="onShowAbout()"
    (openAiChat)="openRolodexAiChat()"
    (runAutomation)="runAutomation()"
    (syncConnect)="onSyncConnect($event)"
    (syncDisconnect)="onSyncDisconnect()"
    (syncSetPassphrase)="onSyncSetPassphrase()"
    (syncPush)="onSyncPush()"
    (syncPull)="onSyncPull()"
    (syncExportLocal)="onSyncExportLocal()"
    (syncImportLocal)="onSyncImportLocal()"
  >
  </app-rolodex>
  </div>

  <!-- 2026-08-19 SEARCH: the missing Search control — a FAB opens the sheet. -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="search-fab">
    <ion-fab-button (click)="openSearchModal()" color="primary" aria-label="Search contacts">
      <ion-icon name="search-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
