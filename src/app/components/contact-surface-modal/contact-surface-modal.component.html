<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="close()">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title style="font-size: 15px;">{{ contact?.name?.display || 'Contact' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="surface-body">
  <!-- 2026-08-16: the full card surface — flip it: chat, reminders, the
       confidante, edit, call, email, map, remove. Everything lives here. -->
  <div class="surface-hint">Tap the card to flip it — chat, reminders, confidante and more live on the back.</div>
  <app-contact-card
    [contacts]="[contact]"
    [viewMode]="'rolodex'"
    [displayedContacts]="[contact]"
  ></app-contact-card>
</ion-content>
