<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="close()">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title style="font-size: 15px;">{{ thread.title }}
      <span class="chat-presence" [class.online]="peersOnline > 0"><span class="presence-dot"></span>{{ peersOnline > 0 ? 'online' : 'offline' }}</span></ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-body">
  <div class="chat-thread">
    <div
      *ngFor="let m of (thread.messages || [])"
      class="chat-bubble"
      [class.from-me]="m.from === 'me'"
      [class.from-system]="m.from === 'system'"
    >
      <span class="chat-text" (click)="pickReaction(m)">{{ m.text }}</span>
      <div *ngIf="pickingId === m.id" class="chat-emoji-row">
        <span *ngFor="let e of EMOJIS" class="chat-emoji" (click)="react(m, e)">{{ e }}</span>
      </div>
      <div *ngIf="m.reactions?.length" class="chat-reactions">
        <span *ngFor="let r of m.reactions" class="chat-reaction-chip">{{ r }}</span>
      </div>
      <span class="chat-time">{{ timeNorm.format(m.at, 'short') }}
        <span *ngIf="m.from === 'me'" class="chat-tick" [class.tick-read]="m.status === 'read'" [class.tick-delivered]="m.status === 'delivered'">
          <ion-icon *ngIf="m.status === 'sent'" name="checkmark-outline"></ion-icon>
          <ion-icon *ngIf="m.status === 'delivered' || m.status === 'read'" name="checkmark-done-outline"></ion-icon>
        </span>
      </span>
    </div>
    <div *ngIf="!thread.messages?.length" class="chat-empty">
      Start the conversation — SMS, email and in-app chat all live off the card.
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="chat-typing" *ngIf="typingName">&#160;{{ typingName }} is typing…</div>
  <app-link-preview *ngIf="previewUrl" [url]="previewUrl"></app-link-preview>
  <div class="chat-input-bar">
    <ion-input
      placeholder="Message…"
      [(ngModel)]="draft"
      (keyup.enter)="send()"
      (ionInput)="onTyping()"
      class="chat-input"
    ></ion-input>
    <!-- 2026-08-28 BUILD 125: ✕ clears the whole composer in one tap. -->
    <ion-button *ngIf="draft.trim()" fill="clear" class="chat-clear"
      (click)="clearDraft()" aria-label="Clear message">
      <ion-icon name="close-circle-outline" slot="icon-only"></ion-icon>
    </ion-button>
    <ion-button (click)="send()" [disabled]="!draft.trim()" size="default">
      <ion-icon name="send-outline"></ion-icon>
    </ion-button>
  </div>
</ion-footer>
