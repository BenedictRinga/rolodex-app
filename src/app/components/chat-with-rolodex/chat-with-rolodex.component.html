<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="close()">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title style="font-size: 15px;">Chat with RolodexAI</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-body">
  <!-- 2026-08-19 THE FRAMING BANNER: feedback OR help — the user chooses. -->
  <div class="chat-banner">
    <ion-icon name="sparkles-outline" slot="start"></ion-icon>
    <div>
      <strong>How can we make RolodexAI better for you?</strong>
      <p>Or do you need help using RolodexAI? Choose below and the Confidante will take it from there.</p>
    </div>
  </div>

  <div class="mode-picker" *ngIf="!mode">
    <ion-button expand="block" fill="outline" color="success" (click)="chooseMode('feedback')">
      <ion-icon name="bulb-outline" slot="start"></ion-icon>
      Give feedback / a suggestion
    </ion-button>
    <ion-button expand="block" fill="outline" color="primary" (click)="chooseMode('help')">
      <ion-icon name="help-circle-outline" slot="start"></ion-icon>
      I need help using RolodexAI
    </ion-button>
  </div>

  <ng-container *ngIf="mode">
    <div class="chat-thread">
      <div *ngFor="let m of messages" class="chat-message" [class.user]="m.from === 'user'">
        <div class="bubble">{{ m.text }}</div>
      </div>
    </div>

    <div class="chat-composer">
      <ion-input
        [(ngModel)]="input"
        placeholder="Tell the Confidante…"
        (keyup.enter)="send()"
        class="chat-input"
        fill="outline"
      ></ion-input>
      <ion-button (click)="send()" [disabled]="!input.trim() || !chatReady">
        <ion-icon name="send-outline"></ion-icon>
      </ion-button>
    </div>
  </ng-container>
</ion-content>
