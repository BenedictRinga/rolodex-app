<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <!-- 2026-09-16 BUILD 216 THE NAMED WEB DOOR (Grok distribution plan, week 3):
       people who hear "LoopKeeper" and type it now find something real — a
       crawlable title + description (the public sentence), canonical, on top
       of the OG/Twitter set below. robots.txt + sitemap.xml ship alongside
       (build assets); tester pages stay noindex. -->
  <!-- 2026-09-17 BUILD 256 THE NORTH STAR, OUT LOUD (founder: "we differentiate
       from Muse and Instinct with an outright statement like 'the app for
       chronic procrastination'. So that we are boldly saying what our North
       Star is"): research showed an AI asking "what is LoopKeeper" found
       OTHER companies' products (a call-center agent, a logistics tool, a
       habit tracker) and never ours — the word procrastination appeared
       NOWHERE in our machine-readable face. The bold claim now leads every
       machine-read surface. -->
  <title>LoopKeeper — the app for chronic procrastination</title>

  <base href="/" />

  <meta name="description" content="LoopKeeper is the app for chronic procrastination: name the thing you keep not doing — a reply owed, a renewal due, a decision avoided — get the words written for you, send it, and the tab in your head shuts. Not a habit tracker, not a to-do list. Born in Kenya — no account, your data stays yours." />
  <link rel="canonical" href="https://zyppar.com/loopkeeper/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- 2026-08-18 THE SHAREAPP MOMENT: the base PWA previews branded even when
       the link has no invite token. The per-invite dynamic OG card is served
       from the backend at /api/loopkeeper/invites/:token/og (the share URL;
       legacy /api/openloop/... links still resolve via the server alias). -->
  <meta property="og:site_name" content="LoopKeeper" />
  <meta property="og:title" content="LoopKeeper — the app for chronic procrastination" />
  <meta property="og:description" content="Name the thing you keep not doing, get the words written for you, send it, and the tab in your head shuts. Not a habit tracker, not a to-do list." />
  <meta property="og:image" content="https://zyppar.com/loopkeeper/assets/loopkeeper/og-1200x630.png" />
  <meta property="og:url" content="https://zyppar.com/loopkeeper/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="LoopKeeper — the app for chronic procrastination" />
  <meta name="twitter:description" content="Name the thing you keep not doing, get the words written for you, send it, and the tab in your head shuts. Not a habit tracker, not a to-do list." />
  <meta name="twitter:image" content="https://zyppar.com/loopkeeper/assets/loopkeeper/og-1200x630.png" />

  <link rel="manifest" href="manifest.webmanifest" />
  <!-- 2026-09-18 BUILD 260 THE TEAL CHROME (founder: "The browser URL bar
       defaults LoopKeeper into an orange color, a legacy of our initial app
       color choice... since we defaulted into teal, it has never updated"):
       theme-color is the browser-chrome tint (URL bar, PWA title bar) — it
       still carried the launch-era #FF5A36. NOT an Ionic default — our own
       first-draft value, never updated. The app's identity is teal. -->
  <meta name="theme-color" content="#14b8a6" />
  <link rel="icon" type="image/png" href="assets/loopkeeper/tile.svg" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/loopkeeper/tile.svg" />
  <link rel="apple-touch-icon" href="assets/loopkeeper/apple-touch-icon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="LoopKeeper" />
</head>

<body>
  <!-- 2026-08-22 SPLASH: OxAlpha's animated mark — the ring draws itself, the
       coral dot orbits once and settles into the gap: loop opened → followed
       through. Falls back gracefully when motion is reduced. -->
  <div id="rolodex-splash">
    <div class="splash-inner">
      <svg class="splash-mark" viewBox="0 0 48 48" aria-label="LoopKeeper">
        <path class="splash-ring" d="M38.67 20.88 A15 15 0 1 1 27.12 9.33" fill="none" stroke="#FAF6F0" stroke-width="7" stroke-linecap="round"/>
        <circle class="splash-dot" cx="34.6" cy="13.4" r="4.5" fill="#FF5A36"/>
      </svg>
      <div class="splash-word">LoopKeeper</div>
      <div class="splash-tag">Close the loop you keep meaning to close.</div>
    </div>
    <style>
      #rolodex-splash {
        position: fixed; inset: 0; z-index: 99999;
        background: #17120E;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.45s ease;
        font-family: Manrope, DM Sans, system-ui, sans-serif;
      }
      .splash-inner { text-align: center; }
      .splash-mark { width: 120px; height: 120px; margin: 0 auto; display: block; }
      .splash-ring { stroke-dasharray: 77.5; stroke-dashoffset: 77.5; animation: lk-draw 0.7s ease-out 0.15s forwards; }
      .splash-dot { opacity: 0; animation: lk-orbit 1.1s cubic-bezier(0.6, 0.05, 0.3, 1) 0.55s forwards; }
      .splash-word { color: #FAF6F0; font-size: 30px; font-weight: 700; letter-spacing: 0.01em; margin-top: 24px; opacity: 0; transform: translateY(8px); animation: lk-rise 0.6s ease-out 1.25s forwards; }
      .splash-tag { color: #B8AC9E; font-size: 14px; letter-spacing: 0.02em; margin-top: 8px; opacity: 0; transform: translateY(8px); animation: lk-rise 0.6s ease-out 1.5s forwards; }
      @keyframes lk-draw { to { stroke-dashoffset: 0; } }
      @keyframes lk-orbit { 0% { opacity: 0; offset-distance: 0%; } 15% { opacity: 1; } 100% { opacity: 1; offset-distance: 100%; } }
      @keyframes lk-rise { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .splash-ring, .splash-dot, .splash-word, .splash-tag { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
      }
      #rolodex-splash.gone { opacity: 0; pointer-events: none; }
    </style>
    <script>
      (function () {
        function hide() {
          var el = document.getElementById('rolodex-splash');
          if (el) {
            el.classList.add('gone');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
          }
        }
        if (document.readyState === 'complete') { setTimeout(hide, 1900); }
        else { window.addEventListener('load', function () { setTimeout(hide, 1900); }); }
      })();
    </script>
  </div>

  <app-root></app-root>
</body>

</html>
