<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>LoopKeeper</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- 2026-08-18 THE SHAREAPP MOMENT: the base PWA previews branded even when
       the link has no invite token. The per-invite dynamic OG card is served
       from the backend at /api/openloop/invites/:token/og (the share URL). -->
  <meta property="og:site_name" content="LoopKeeper" />
  <meta property="og:title" content="LoopKeeper — You never forget to stay in touch… again" />
  <meta property="og:description" content="The contacts app that remembers why you know someone — and nudges you before you forget." />
  <meta property="og:image" content="https://zyppar.com/openloop/assets/rolodex/icon-512.png" />
  <meta property="og:url" content="https://zyppar.com/openloop/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="LoopKeeper — You never forget to stay in touch… again" />
  <meta name="twitter:description" content="The contacts app that remembers why you know someone." />
  <meta name="twitter:image" content="https://zyppar.com/openloop/assets/rolodex/icon-512.png" />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#FF6B35" />
  <link rel="icon" type="image/png" href="assets/loopkeeper/tile.svg" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/loopkeeper/tile.svg" />
  <link rel="apple-touch-icon" href="assets/rolodex/apple-touch-icon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="LoopKeeper" />
</head>

<body>
  <!-- 2026-08-18 SPLASH: the user's own logos - the single icon + the name,
       background-stripped, standing alone. -->
  <div id="rolodex-splash">
    <div class="splash-inner">
      <img src="assets/rolodex/icon-512.png" alt="LoopKeeper" class="splash-logo" />
      <img src="assets/rolodex/name-512.png" alt="LoopKeeper" class="splash-wordmark" />
      <div class="splash-tag">You never forget to stay in touch… again</div>
    </div>
    <style>
      #rolodex-splash {
        position: fixed; inset: 0; z-index: 99999;
        background: #12141c;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.45s ease;
      }
      .splash-inner { text-align: center; }
      .splash-logo { width: 88px; height: 88px; border-radius: 22px; }
      .splash-wordmark { width: 200px; margin-top: 16px; }
      .splash-tag { color: #8b93b0; font-size: 12px; margin-top: 8px; font-family: system-ui, sans-serif; }
      #rolodex-splash.gone { opacity: 0; pointer-events: none; }
    </style>
    <script>
      (function () {
        function hide() {
          var el = document.getElementById('rolodex-splash');
          if (el) {
            el.classList.add('gone');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
          }
        }
        if (document.readyState === 'complete') { setTimeout(hide, 650); }
        else { window.addEventListener('load', function () { setTimeout(hide, 650); }); }
      })();
    </script>
  </div>

  <app-root></app-root>
</body>

</html>
