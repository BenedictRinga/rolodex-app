<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180">
  <!-- RolodexAI wordmark lockup - the mark + the name, on transparent. -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FFD93D"/>
    </linearGradient>
  </defs>
  <!-- the mark (scaled to 96px, top-left) -->
  <g transform="translate(0, 14) scale(0.1875)">
    <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg2)"/>
    <rect x="97" y="107" width="318" height="318" rx="66" fill="#FFFFFF"/>
    <circle cx="377" cy="145" r="14" fill="#FFD93D"/>
    <circle cx="256" cy="214" r="54" fill="#4f6df5"/>
    <ellipse cx="256" cy="326" rx="80" ry="59" fill="#4f6df5"/>
  </g>
  <!-- the name: Rolodex (dark) + AI (indigo) -->
  <text x="128" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="84" font-weight="700" letter-spacing="-1" fill="#1E2328">Rolodex</text>
  <text x="528" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="84" font-weight="800" letter-spacing="-1" fill="#4f6df5">AI</text>
</svg>
