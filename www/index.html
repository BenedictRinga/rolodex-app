  <!-- 2026-08-22 SPLASH: OxAlpha's animated mark — the ring draws itself, the
       coral dot orbits once and settles into the gap: loop opened → followed
       through. Falls back gracefully when motion is reduced. -->
  <div id="rolodex-splash">
    <div class="splash-inner">
      <svg class="splash-mark" viewBox="0 0 48 48" aria-label="LoopKeeper">
        <path class="splash-ring" d="M38.67 20.88 A15 15 0 1 1 27.12 9.33" fill="none" stroke="#FAF6F0" stroke-width="7" stroke-linecap="round"/>
        <circle class="splash-dot" cx="34.6" cy="13.4" r="4.5" fill="#FF5A36"/>
      </svg>
      <div class="splash-word">LoopKeeper</div>
      <div class="splash-tag">Close the loop you keep meaning to close.</div>
    </div>
    <style>
      #rolodex-splash {
        position: fixed; inset: 0; z-index: 99999;
        background: #17120E;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.45s ease;
        font-family: Manrope, DM Sans, system-ui, sans-serif;
      }
      .splash-inner { text-align: center; }
      .splash-mark { width: 120px; height: 120px; margin: 0 auto; display: block; }
      .splash-ring { stroke-dasharray: 77.5; stroke-dashoffset: 77.5; animation: lk-draw 0.7s ease-out 0.15s forwards; }
      .splash-dot { opacity: 0; animation: lk-orbit 1.1s cubic-bezier(0.6, 0.05, 0.3, 1) 0.55s forwards; }
      .splash-word { color: #FAF6F0; font-size: 30px; font-weight: 700; letter-spacing: 0.01em; margin-top: 24px; opacity: 0; transform: translateY(8px); animation: lk-rise 0.6s ease-out 1.25s forwards; }
      .splash-tag { color: #B8AC9E; font-size: 14px; letter-spacing: 0.02em; margin-top: 8px; opacity: 0; transform: translateY(8px); animation: lk-rise 0.6s ease-out 1.5s forwards; }
      @keyframes lk-draw { to { stroke-dashoffset: 0; } }
      @keyframes lk-orbit { 0% { opacity: 0; offset-distance: 0%; } 15% { opacity: 1; } 100% { opacity: 1; offset-distance: 100%; } }
      @keyframes lk-rise { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .splash-ring, .splash-dot, .splash-word, .splash-tag { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
      }
      #rolodex-splash.gone { opacity: 0; pointer-events: none; }
    </style>
    <script>
      (function () {
        function hide() {
          var el = document.getElementById('rolodex-splash');
          if (el) {
            el.classList.add('gone');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
          }
        }
        if (document.readyState === 'complete') { setTimeout(hide, 1900); }
        else { window.addEventListener('load', function () { setTimeout(hide, 1900); }); }
      })();
    </script>
  </div>
